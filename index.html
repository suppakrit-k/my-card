<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Card - Restricted Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        titanium: '#1c1c1c',
                        gold: '#D4AF37',
                        glass: 'rgba(255, 255, 255, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000;
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            color: #fff;
            overflow: hidden;
        }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .btn-action {
            transition: all 0.3s ease;
        }
        .btn-action:active {
            transform: scale(0.95);
        }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; opacity: 0; transform: translateY(10px); }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        #security-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }
        .hidden-screen {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="security-screen">
        <div class="text-center p-8">
            <div class="mb-6 text-5xl text-gray-600 animate-pulse"><i class="fas fa-lock"></i></div>
            <h2 class="text-white text-xl mb-2 font-bold tracking-widest uppercase">Restricted Access</h2>
            <p class="text-gray-500 text-sm mb-6">Please enter access code to view</p>
            
            <div class="relative">
                <input type="password" id="passcode" placeholder="Enter Code" 
                       class="bg-gray-900 text-white text-xl border border-gray-700 rounded-xl px-4 py-3 text-center focus:outline-none focus:border-gold w-64 transition shadow-inner placeholder-gray-700">
                <button onclick="checkAccess()" class="absolute right-2 top-2 bottom-2 bg-gray-800 hover:bg-gold hover:text-black text-gray-400 rounded-lg px-3 transition">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            
            <div id="error-msg" class="text-red-500 text-sm mt-4 hidden opacity-0 transition-opacity duration-300">
                <i class="fas fa-times-circle"></i> Access Denied
            </div>
        </div>
    </div>

    <div class="glass-card w-full max-w-sm rounded-3xl p-8 text-center relative overflow-hidden border-t border-gray-800">
        
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-900 rounded-full blur-[80px] opacity-40"></div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-gold rounded-full blur-[80px] opacity-20"></div>

        <div class="relative w-32 h-32 mx-auto mb-6 fade-in">
            <div class="w-full h-full rounded-full bg-gray-800 flex items-center justify-center border-2 border-gray-600 shadow-2xl overflow-hidden relative">
                <span id="fallback-icon" class="absolute text-4xl text-gray-500"><i class="fas fa-user-tie"></i></span>
                <!-- Image tag starts hidden -->
                <img id="profile-img" alt="Profile" class="w-full h-full object-cover object-[center_15%] relative z-10 hidden"> 
            </div>
            <div class="absolute bottom-2 right-2 w-4 h-4 bg-green-500 border-2 border-black rounded-full z-20"></div>
        </div>

        <div class="fade-in delay-1">
            <!-- Name Placeholder -->
            <h1 id="profile-name" class="text-2xl font-bold tracking-wide text-white mb-1">Protected User</h1>
            <p class="text-gold text-sm font-medium tracking-widest uppercase mb-4">Independent Consultant</p>
            <p class="text-gray-400 text-sm mb-6 px-4">
                Specialized in AI Strategy, Governance Frameworks & Responsible AI.
            </p>
        </div>

        <div class="grid grid-cols-4 gap-4 mb-8 fade-in delay-2">
            <a id="link-phone" href="#" class="btn-action flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-white group-hover:bg-blue-600 transition">
                    <i class="fas fa-phone"></i>
                </div>
                <span class="text-xs text-gray-500">Call</span>
            </a>
            <a id="link-email" href="#" class="btn-action flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-white group-hover:bg-red-500 transition">
                    <i class="fas fa-envelope"></i>
                </div>
                <span class="text-xs text-gray-500">Email</span>
            </a>
            <a id="link-line" href="#" target="_blank" class="btn-action flex flex-col items-center gap-2 group">
				<div class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-white group-hover:bg-[#06c755] transition">
                	<i class="fab fa-line text-xl"></i>
				</div>
				<span class="text-xs text-gray-500">Line</span>
			</a>
			<a id="link-linkedin" href="#" target="_blank" class="btn-action flex flex-col items-center gap-2 group">
                <div class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-white group-hover:bg-[#0077b5] transition">
                    <i class="fab fa-linkedin-in"></i>
                </div>
                <span class="text-xs text-gray-500">LinkedIn</span>
            </a>			
        </div>

        <button onclick="downloadVCard()" class="fade-in delay-3 w-full py-4 rounded-xl bg-gradient-to-r from-gray-100 to-gray-300 text-black font-bold text-lg shadow-lg hover:shadow-white/20 hover:scale-[1.02] transition active:scale-95 flex items-center justify-center gap-3">
            <i class="fas fa-user-plus"></i> Save Contact
        </button>

        <div class="mt-8 pt-6 border-t border-gray-800 fade-in delay-3">
            <p class="text-xs text-gray-600 font-mono">AI STRATEGY & GOVERNANCE</p>
        </div>

    </div>

            let hash = 0;

                hash |= 0;
            }

${n_field}

END:VCARD`;

            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isInApp = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1) || (ua.indexOf("Line") > -1);

            // 2. Try Native Share API (Best for Mobile - iOS/Android)

            try {

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
